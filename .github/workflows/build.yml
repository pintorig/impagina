name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installa Gradle direttamente: così la pipeline funziona anche se
      # gradle-wrapper.jar non è stato ancora committato.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # I test girano per primi: se la geometria o il codec si rompono,
      # un APK che compila non serve a niente.
      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: documento-a4-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
