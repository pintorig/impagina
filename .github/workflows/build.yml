name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Una push che ne supera un'altra sullo stesso ramo annulla la precedente:
# non ha senso tenere occupato un runner per un commit già sorpassato.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test e analisi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Nessun gradle-version: si usa il wrapper committato, così la CI
      # verifica esattamente la versione di Gradle che usa chi clona.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # I test girano per primi: se la geometria, la curva tonale o il codec
      # si rompono, un APK che compila non serve a niente.
      - name: Unit test
        run: ./gradlew test --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # always(): i report servono soprattutto quando qualcosa è fallito.
      - name: Report dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Report di Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: APK di debug
        uses: actions/upload-artifact@v4
        with:
          name: impagina-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
