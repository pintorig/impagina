name: CodeQL

on:
  push:
    branches: [main]
  # Nessun filtro sul ramo di destinazione: una PR impilata su un'altra PR
  # ha come base un ramo che non è main, e con il filtro non veniva
  # analizzata affatto. È così che una regressione è arrivata in main senza
  # che nulla la segnalasse.
  pull_request:
  schedule:
    # Lunedì alle 6:00 UTC: intercetta le vulnerabilità note emerse dopo
    # l'ultimo commit, su un progetto che può restare fermo per mesi.
    - cron: '0 6 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # build-mode resta "manual": l'analisi vede il codice come lo vede il
      # compilatore. Non si può usare "none", che estrae solo il Java e qui
      # non troverebbe nulla da analizzare — il progetto è tutto Kotlin.
      # Il vincolo si paga invece sulla versione di Kotlin: vedi CLAUDE.md.
      - name: Inizializza CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # --no-build-cache --rerun-tasks: l'estrattore di CodeQL intercetta il
      # compilatore, quindi se la build viene servita dalla cache non compila
      # niente e l'analisi finisce con «could not process any code written in
      # Java/Kotlin» — un verde vuoto. Succede su ogni PR che non tocca i
      # sorgenti Kotlin, documentazione compresa. Costa qualche minuto, ed e'
      # il prezzo per analizzare davvero il codice.
      - name: Build
        run: ./gradlew assembleDebug --no-build-cache --rerun-tasks --stacktrace

      - name: Analisi
        uses: github/codeql-action/analyze@v4
