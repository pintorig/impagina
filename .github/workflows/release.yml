name: Release

# Si attiva su un tag di versione: git tag v1.9.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # serve a creare la release e allegare l'APK

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit test
        run: gradle test --stacktrace

      # La firma è opzionale: senza i secret esce un APK non firmato, utile
      # comunque per provarlo via adb. Con i secret esce installabile.
      - name: Prepara la firma
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build release
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            gradle assembleRelease --stacktrace \
              -PKEYSTORE_FILE="$RUNNER_TEMP/keystore.jks" \
              -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
              -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
              -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          else
            echo "::warning::Nessun keystore nei secret: l'APK non sarà firmato."
            gradle assembleRelease --stacktrace
          fi

      # Le note di rilascio si estraggono dal CHANGELOG invece di riscriverle:
      # un changelog che nessuno legge è un changelog che smette di essere vero.
      - name: Estrai le note dal CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Vedi CHANGELOG.md" > release-notes.md
          fi

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
