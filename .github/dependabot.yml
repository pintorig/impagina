version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # AndroidX e Compose vanno aggiornati insieme: PR separate per ogni
      # artefatto dello stesso BOM sono rumore, non informazione.
      androidx:
        patterns: ["androidx.*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
